version: '3.8'

services:
  # ========================================
  # Frontend (React + Vite)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cotizador-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
      - NODE_ENV=development
    depends_on:
      - ms-core
    networks:
      - frontend-network
    command: npm run dev -- --host

  # ========================================
  # Backend (NestJS)
  # ========================================
  ms-core:
    build:
      context: ./ms-core
      dockerfile: Dockerfile.dev
    container_name: cotizador-backend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./ms-core:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_NAME=segurax
    depends_on:
      - postgres
    networks:
      - frontend-network
      - backend-network
    command: npm run start:dev

  # ========================================
  # PostgreSQL
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: cotizador-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=segurax
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network

  # ========================================
  # Redis (Opcional - para cache)
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: cotizador-redis-dev
    ports:
      - "6379:6379"
    networks:
      - backend-network

volumes:
  postgres-data:

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
