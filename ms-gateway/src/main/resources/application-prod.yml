spring:
  cloud:
    gateway:
      routes:
        # ms-core: Backend API service (production)
        - id: ms-core
          uri: ${MS_CORE_URL:http://ms-core:3000}
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=1

        # ms-frontend: React frontend (production build)
        - id: ms-frontend
          uri: ${MS_FRONTEND_URL:http://frontend:80}
          predicates:
            - Path=/**
          filters:
            - RemoveRequestHeader=Cookie

      # Global CORS configuration for production
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_ORIGIN:https://segurax.com}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Requested-With
              - Accept
              - Origin
            allowCredentials: true

# Production logging
logging:
  level:
    org.springframework.cloud.gateway: WARN
    com.segurax.gateway: INFO
    reactor.netty: WARN
