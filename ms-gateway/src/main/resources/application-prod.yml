spring:
  cloud:
    gateway:
      routes:
        # ── ms-catalogos: más específico — DEBE ir primero ──
        - id: ms-catalogos
          uri: ${MS_CATALOGOS_URL:http://ms-catalogos:3001}
          predicates:
            - Path=/api/v1/catalogos/**
          filters:
            - StripPrefix=2

        # ── ms-core: catch-all para el resto de /api/v1/** ──
        - id: ms-core
          uri: ${MS_CORE_URL:http://ms-core:3000}
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=2

        # ── Frontend: catch-all final (DEBE ir último) ──────
        - id: ms-frontend
          uri: ${MS_FRONTEND_URL:http://frontend:8080}
          predicates:
            - Path=/**
          filters:
            - RemoveRequestHeader=Cookie

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              # Con IP dinámica de EC2 o sin auth: '*' es aceptable en QA
              # En producción real: cambiar a 'https://tu-dominio.com'
              - "${FRONTEND_ORIGIN:*}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            # false cuando allowedOrigins es '*' — son incompatibles
            allowCredentials: false

# Logging reducido en producción
logging:
  level:
    org.springframework.cloud.gateway: WARN
    com.segurax.gateway: INFO
    reactor.netty: WARN
