server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      routes:
      # ms-core: Backend API service (ALWAYS FIRST - more specific paths)
      - id: ms-core
        uri: http://localhost:3000
        predicates:
        - Path=/api/v1/**
        filters:
        - StripPrefix=2

      # Static resources: Favicon (avoid routing to frontend)
      - id: static-favicon
        uri: http://localhost:3000
        predicates:
        - Path=/favicon.ico
        filters:
        - SetStatus=204

      # Health and actuator endpoints
      - id: gateway-actuator
        uri: http://localhost:8080
        predicates:
        - Path=/actuator/**

      # ms-frontend: React frontend application (CATCH-ALL - must be last)
      - id: ms-frontend
        uri: http://localhost:5173
        predicates:
        - Path=/**
        - Method=GET,POST,PUT,DELETE,PATCH
        filters:
        - RemoveRequestHeader=Cookie

      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# Logging configuration
logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.segurax.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
