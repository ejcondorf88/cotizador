version: '3.8'

services:
  # ========================================
  # Frontend (Nginx)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: cotizador-frontend-prod
    ports:
      - "80:8080"
    environment:
      - NODE_ENV=production
    depends_on:
      - ms-core
    networks:
      - frontend-network
    restart: always

  # ========================================
  # Backend (NestJS)
  # ========================================
  ms-core:
    build:
      context: ./ms-core
      dockerfile: Dockerfile
      target: production
    container_name: cotizador-backend-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-segurax}
    depends_on:
      - postgres
    networks:
      - frontend-network
      - backend-network
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ========================================
  # PostgreSQL
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: cotizador-postgres-prod
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-segurax}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres-data:

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
    internal: true
